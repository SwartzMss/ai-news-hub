<text x="31" y="67.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#6a8176">Research, publish and deliver a daily digest.</text>
<text x="671" y="40.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#08765b">Task → Run → Thread → Turn</text>
