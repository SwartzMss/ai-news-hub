name: Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: bash -n scripts/service.sh
      - name: Verify systemd unit with runner Node path
        run: |
          probe_unit_dir=$(mktemp -d)
          probe_node=$(command -v node)
          sed "s|^ExecStart=/usr/bin/node |ExecStart=$probe_node |" deploy/systemd/ai-news-hub.service > "$probe_unit_dir/ai-news-hub.service"
          systemd-analyze verify "$probe_unit_dir/ai-news-hub.service"
