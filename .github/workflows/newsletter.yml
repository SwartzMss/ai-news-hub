name: Daily public newsletter
run-name: Newsletter ${{ inputs.dispatch_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Backend dispatch ID
        required: false
        type: string
      scheduled_at:
        description: Planned Asia/Shanghai time
        required: false
        type: string
      trigger_reason:
        description: scheduled, retry, or manual
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-newsletter
  cancel-in-progress: false
jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Log dispatch timing
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ID: ${{ inputs.dispatch_id || 'manual' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at || 'manual' }}
          TRIGGER_REASON: ${{ inputs.trigger_reason || 'manual' }}
        run: |
          echo "Event: ${EVENT_NAME}"
          echo "Dispatch ID: ${DISPATCH_ID}"
          echo "Scheduled at: ${SCHEDULED_AT}"
          echo "Trigger reason: ${TRIGGER_REASON}"
          echo "Started at UTC: $(date -u --iso-8601=seconds)"
          echo "Started at Asia/Shanghai: $(TZ=Asia/Shanghai date --iso-8601=seconds)"
      - name: Send approved production daily aggregate
        env:
          # Prefer the documented names; older production settings used the names in reverse.
          NEWSLETTER_SITE_URL: ${{ vars.NEWSLETTER_SITE_URL || vars.NEWSLETTER_SEND_SECRET }}
          NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET || secrets.NEWSLETTER_SITE_URL }}
        run: node scripts/send-newsletter.mjs
