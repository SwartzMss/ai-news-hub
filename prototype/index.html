function decodeRoute(){const h=location.hash.replace(/^#\/?/,'');if(!h||h==='home'){state.page='home';return;}if(h.startsWith('article/')){state.page='article';state.article=Number(h.split('/')[1]);return;}if(h.startsWith('channel/')){state.page='channel';state.channel=h.split('/')[1];return;}if(['archive','search','admin','saved'].includes(h)){state.page=h;return;}state.page='home';}

function savedPage(){const arr=data.filter(a=>state.bookmarks.has(a.id));return `<div class="crumb">资料库 / <b>我的收藏</b></div><section class="pagehead"><div class="smallcaps">YOUR READING LIST</div><h1>稍后再读</h1><p>保存感兴趣的文章。当前收藏仅保存在这个演示页面内，不会写入后端。</p></section>${arr.length?stories(arr):`<div class="empty">还没有收藏文章。打开一篇新闻，点击书签即可加入这里。</div>`}`;}
function adminPage(){const tasks=[['AI 科技日报','每天 08:00','ai'],['开源项目雷达','每天 09:30','open'],['热点话题分析','每天 13:00','trending']];return `<div class="crumb">工作台 / <b>任务控制台</b></div><section class="pagehead"><div class="smallcaps">LOCAL OPERATIONS</div><h1>让每条日报都有迹可循。</h1><p>管理计划任务、检查 Agent 运行事件与发布记录。实际部署时，这部分位于 Linux 主机的受保护管理服务（默认仅 localhost 访问）。</p></section><div class="admin-note">${ic('info','sm')} 交互演示：点击“模拟运行”仅更新页面展示，不会调用 Codex，也不会更改 GitHub / RSS。</div><div class="stats-grid"><div class="stat-card"><strong>03</strong><span>计划任务</span></div><div class="stat-card"><strong>${state.adminRunning?'01':'00'}</strong><span>正在执行（演示）</span></div><div class="stat-card"><strong>06</strong><span>本日入库（演示）</span></div></div><div class="eyebrow-bar"><h2 class="section-title">任务与调度</h2><span class="tiny muted">Local-only admin</span></div><div class="task-table">${tasks.map(([name,time,cat],i)=>`<div class="task-row"><div class="task-symbol">${ic(i===0?'layers':i===1?'code':'flame')}</div><div class="task-info"><b>${name}</b><div>${time} · ${i===0?'示例任务':'尚未启用真实服务'}</div></div><span class="status">${i===0&&state.adminRunning?'运行中':'待接入'}</span><button class="task-run" data-action="simulate" ${state.adminRunning?'disabled':''}>${i===0&&state.adminRunning?'执行中':'模拟运行'}</button></div>`).join('')}</div><div class="divider-title"><h2 class="section-title">最近执行日志</h2><span class="tiny muted">仅界面模拟</span></div><div class="logs"><div><b>[demo]</b> 当前原型未连接 App Server</div>${state.adminLog.map(line=>`<div>${line}</div>`).join('')}<div><b>[info]</b> 未来将显示 thread/start、turn/start 和事件流</div></div>`;}
function rssModal(){const feeds=[['综合新闻','/rss/all.xml'],['AI / 科技','/rss/ai.xml'],['投资市场','/rss/investment.xml'],['开源项目','/rss/opensource.xml'],['热点话题','/rss/trending.xml']];return `<div class="modal-underlay" data-action="closeModalBg"><div class="modal" role="dialog" aria-modal="true" aria-label="RSS 订阅"><div style="display:flex;align-items:center;justify-content:space-between"><span class="smallcaps">FEEDS / SUBSCRIBE</span><button class="icon-btn" data-action="closeModal" aria-label="关闭弹窗">${ic('close')}</button></div><h2>订阅你关心的频道。</h2><p>这些是计划中的 RSS 路径示例；尚未部署域名或生成真实订阅文件。</p>${feeds.map(([name,path])=>`<div class="feed-line"><span style="font-size:12px;font-weight:750">${name}<br><code>${path}</code></span><button data-copy="${path}">${ic('copy','sm')} 复制路径</button></div>`).join('')}<p style="margin-top:14px">正式部署后，将提供可直接复制的完整 HTTPS URL 和 RSS 阅读器一键订阅入口。</p></div></div>`;}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function render(){document.documentElement.dataset.theme=state.theme;let content=({home,channel:channelPage,article:detailPage,archive,search:searchPage,admin:adminPage,saved:savedPage})[state.page]?.()||home();document.getElementById('app').innerHTML=`<div class="shell">${header()}${mobileNav()}<div class="app-grid">${sidebar()}<main class="center">${content}</main>${panel()}</div></div>${state.modal?rssModal():''}`;}
function notify(text){document.querySelector('.toast')?.remove();let node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=text;document.body.appendChild(node);setTimeout(()=>node.remove(),2200);}
async function copy(s){try{await navigator.clipboard.writeText(s);notify('已复制到剪贴板');}catch(e){let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();notify('已复制到剪贴板');}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-nav],[data-article],[data-bookmark],[data-date],[data-copy],[data-action]');if(!el)return;let x=el.dataset;if(x.nav){go(x.nav);return}if(x.article){go('article/'+x.article);return}if(x.bookmark){let id=+x.bookmark;if(state.bookmarks.has(id))state.bookmarks.delete(id);else state.bookmarks.add(id);render();notify(state.bookmarks.has(id)?'已加入收藏':'已取消收藏');return}if(x.date){state.date=x.date;render();return}if(x.copy){copy(x.copy);return}if(x.action==='closeModalBg'&&e.target!==el)return;switch(x.action){case 'rss':state.modal=true;render();break;case 'closeModal':case 'closeModalBg':state.modal=false;render();break;case 'theme':state.theme=state.theme==='light'?'dark':'light';try{localStorage.setItem('anh-theme',state.theme)}catch(e){}render();break;case 'toSearch':go('search');setTimeout(()=>document.getElementById('searchInput')?.focus(),0);break;case 'important':state.onlyImportant=!state.onlyImportant;render();break;case 'todayHighlights':document.getElementById('highlights')?.scrollIntoView({behavior:'smooth'});break;case 'back':history.length>1?history.back():go('home');break;case 'copyArticle':copy(location.href);break;case 'simulate':if(state.adminRunning)return;state.adminRunning=true;state.adminLog=['<b>[demo]</b> 启动模拟任务……'];render();setTimeout(()=>{state.adminRunning=false;state.adminLog=['<b>[done]</b> 演示执行已结束（未运行任何 Codex 任务）','<b>[demo]</b> 模拟任务阶段：采集 → 分析 → 导出'];if(state.page==='admin')render();},1250);break;}});
document.addEventListener('change',e=>{if(e.target.dataset.select==='date'){state.date=e.target.value;render()}if(e.target.dataset.select==='sort'){state.sort=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const cursor=e.target.selectionStart;state.query=e.target.value;render();const inp=document.getElementById('searchInput');if(inp){inp.focus();inp.setSelectionRange(cursor,cursor);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=false;render()}else if(e.key==='/'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){e.preventDefault();go('search');document.getElementById('searchInput')?.focus();}});
window.addEventListener('hashchange',()=>{decodeRoute();render()});decodeRoute();render();
</script>
</body>
</html>
